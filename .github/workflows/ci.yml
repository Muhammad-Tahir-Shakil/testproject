name: CI

# Runs on pull requests and on non-main branches. The deploy workflow runs the
# same checks before it touches AWS; this one gives the signal before merge.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The SAM runtime is python3.12; 3.11 is the declared floor in
        # pyproject.toml. Test both so the floor stays honest.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,aws]'

      - name: Test
        run: pytest -q

      - name: Verify the training fixture is reproducible
        run: |
          python scripts/generate_training_data.py
          git diff --exit-code -- data/training.json

      - name: Static validation (contracts, dashboards, docs)
        run: python scripts/validate_project.py

      - name: Scoring invariants across every fixture scenario
        run: python scripts/simulate_scoring.py

  browser-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Execute the browser second-opinion model
        # frontend/local-ai.js has no DOM dependency beyond sessionStorage and
        # fetch, so it can be run for real rather than only parsed.
        run: node scripts/check_browser_model.mjs

  template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate template
        # --lint runs cfn-lint; no AWS credentials are needed for validation.
        run: sam validate --template template.yaml --lint --region us-east-1
